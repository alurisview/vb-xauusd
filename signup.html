<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AlurisView</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #131722;
            color: #d1d4dc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background-color: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #b2b5be;
            text-decoration: none;
            font-size: 14px;
        }
        .back-home:hover {
            color: #fff;
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            margin-top: 10px;
        }
        .modal-subtitle {
            font-size: 14px;
            color: #b2b5be;
            margin-bottom: 25px;
        }
        .auth-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .auth-btn:hover {
            opacity: 0.9;
        }
        .btn-facebook {
            background-color: #1877f2;
            color: #ffffff;
        }
        .btn-email {
            background-color: #ea4335;
            color: #ffffff;
        }
        .btn-phone {
            background-color: #25d366;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="modal-card">
        <a href="index.html" class="back-home">← ត្រឡប់ក្រោយ</a>
        <div class="modal-title">Sign Up to AlurisView</div>
        <div class="modal-subtitle">Choose your preferred method to contact or register</div>
        
        <div class="auth-options">
            <!-- ជំនួស Link ហ្វេសប៊ុករបស់អ្នកនៅទីនេះ -->
            <a href="https://facebook.com/your-profile" target="_blank" class="auth-btn btn-facebook">
                📘 Continue with Facebook
            </a>
            
            <!-- ជំនួស Email របស់អ្នកនៅទីនេះ -->
            <a href="mailto:your-email@gmail.com" class="auth-btn btn-email">
                ✉️ Continue with Email
            </a>
            
            <!-- ជំនួសលេខទូរស័ព្ទរបស់អ្នកនៅទីនេះ -->
            <a href="tel:+85512345678" class="auth-btn btn-phone">
                📱 Continue with Phone Number
            </a>
        </div>
    </div>

</body>
</html>
