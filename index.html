<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlurisView - Professional BBMA Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #131722;
            color: #d1d4dc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1e222d;
            border-bottom: 1px solid #2a2e39;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #f0b90b;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #b2b5be;
        }
        .nav-links span {
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-links span:hover {
            color: #fff;
        }
        .btn-get-started {
            background-color: #2962ff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-get-started:hover {
            background-color: #1e53e5;
        }

        /* Hero Section with Trading/BBMA Background */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(19, 23, 34, 0.85), rgba(19, 23, 34, 0.95)), 
                        url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            position: relative;
        }
        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }
        .hero p {
            font-size: 18px;
            color: #b2b5be;
            margin-bottom: 30px;
        }
        .hero-btn {
            background-color: #f0b90b;
            color: #131722;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .hero-btn:hover {
            background-color: #d9a505;
        }
        .hero-subtext {
            font-size: 12px;
            color: #787b86;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo-area">
            📈 AlurisView
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Community</span>
            <span>Markets</span>
            <span>Brokers</span>
        </div>
        <div>
            <a href="#" class="btn-get-started">Get started</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Where the market meets BBMA precision</h1>
        <p>Join professional traders utilizing advanced XAUUSD signal analytics and strategy workflows.</p>
        <a href="#" class="hero-btn">Get started for free</a>
        <div class="hero-subtext">$0 forever, no credit card needed</div>
    </section>

</body>
</html>
