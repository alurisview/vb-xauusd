<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlurisView - Professional BBMA Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #131722;
            color: #d1d4dc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1e222d;
            border-bottom: 1px solid #2a2e39;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #f0b90b;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #b2b5be;
        }
        .nav-links span {
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-links span:hover {
            color: #fff;
        }
        .btn-get-started {
            background-color: #2962ff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .btn-get-started:hover {
            background-color: #1e53e5;
        }

        /* Hero Section with BBMA Background */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(19, 23, 34, 0.85), rgba(19, 23, 34, 0.95)), 
                        url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            position: relative;
        }
        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }
        .hero p {
            font-size: 18px;
            color: #b2b5be;
            margin-bottom: 30px;
        }
        .hero-btn {
            background-color: #f0b90b;
            color: #131722;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
            border: none;
        }
        .hero-btn:hover {
            background-color: #d9a505;
        }
        .hero-subtext {
            font-size: 12px;
            color: #787b86;
            margin-top: 10px;
        }

        /* Modal / Pop-up Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background-color: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: #787b86;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #fff;
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .modal-subtitle {
            font-size: 14px;
            color: #b2b5be;
            margin-bottom: 25px;
        }

        /* Registration Buttons */
        .auth-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        .auth-btn:hover {
            opacity: 0.9;
        }
        .btn-facebook {
            background-color: #1877f2;
            color: #ffffff;
        }
        .btn-email {
            background-color: #ea4335;
            color: #ffffff;
        }
        .btn-phone {
            background-color: #25d366;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo-area">
            📈 AlurisView
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Community</span>
            <span>Markets</span>
            <span>Brokers</span>
        </div>
        <div>
            <button class="btn-get-started" onclick="openModal()">Get started</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Where the market meets BBMA precision</h1>
        <p>Join professional traders utilizing advanced XAUUSD signal analytics and strategy workflows.</p>
        <button class="hero-btn" onclick="openModal()">Get started for free</button>
        <div class="hero-subtext">$0 forever, no credit card needed</div>
    </section>

    <!-- Sign-Up Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal-card">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-title">Sign Up to AlurisView</div>
            <div class="modal-subtitle">Choose your preferred method to create an account</div>
            
            <div class="auth-options">
                <button class="auth-btn btn-facebook" onclick="alert('Facebook Registration Process')">
                    📘 Continue with Facebook
                </button>
                <button class="auth-btn btn-email" onclick="alert('Email Registration Process')">
                    ✉️ Continue with Email
                </button>
                <button class="auth-btn btn-phone" onclick="alert('Phone Number Registration Process')">
                    📱 Continue with Phone Number
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Control -->
    <script>
        function openModal() {
            document.getElementById('signupModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('signupModal').style.display = 'none';
        }
        // Close modal if user clicks outside of it
        window.onclick = function(event) {
            var modal = document.getElementById('signupModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
